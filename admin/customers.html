<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Customers — S&amp;R Concrete Crafts Admin</title>
  <link rel="icon" href="/favicon.ico?v=20260915" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png?v=20260915" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png?v=20260915" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260915" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="admin-gate" id="adminGate">Checking your access…</div>

  <div class="admin-app" id="adminApp" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="admin-sidebar" aria-label="Admin menu">
      <div class="sidebar-brand">
        <img src="/assets/sandrlogo.jpg" alt="" width="44" height="44" />
        <div>
          <strong>S&amp;R Concrete Crafts</strong>
          <span>Shop manager</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="adminNav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="account-chip">
          <span class="label">Signed in as</span>
          <span class="email" id="ownerEmail">—</span>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="signOutBtn">Sign Out</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-controls="adminSidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-row">
          <div>
            <h1>Customers</h1>
            <p class="desktop-only">People with paid Stripe Checkout orders.</p>
          </div>
        </div>
      </header>

      <div class="flash" id="flash" hidden role="status"></div>
      <div id="listState" class="state-box">Loading customers…</div>
      <div id="customerList" class="customer-card-list" hidden></div>
    </main>
  </div>

  <div id="customerDetailSheet" class="action-sheet" hidden>
    <div class="action-sheet-backdrop" id="customerDetailBackdrop" hidden></div>
    <div class="action-sheet-panel order-detail-panel" role="dialog" aria-modal="true" aria-labelledby="customerDetailTitle">
      <h2 id="customerDetailTitle">Customer</h2>
      <div id="customerDetailBody" class="order-detail-body"></div>
      <button type="button" class="btn btn-ghost btn-block" id="customerDetailClose">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="/js/env.js" onerror="window.__SR_ENV_LOAD_ERROR__=true"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/admin/admin-auth.js"></script>
  <script src="/admin/admin-shell.js"></script>
  <script src="/admin/catalog-api.js"></script>
  <script src="/admin/sales-lib.js"></script>
  <script src="/admin/customers.js"></script>
</body>
</html>
