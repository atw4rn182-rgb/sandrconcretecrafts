<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Sign In — S &amp; R Concrete Crafts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="../assets/logo-crop.png" alt="S &amp; R Crafts Concrete Art logo" width="72" height="72" />
        <div>
          <h1 id="loginTitle">Owner sign in</h1>
          <p>Manage your S &amp; R Concrete Crafts shop from one simple place.</p>
        </div>
      </div>

      <div class="form-error" id="loginError" role="alert" aria-live="polite"></div>
      <div class="login-setup" id="setupHint"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" />
            <button type="button" class="password-toggle" id="togglePassword" aria-pressed="false">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="signInBtn">
          <span class="btn-label">Sign In</span>
        </button>
      </form>

      <p class="form-hint">Having trouble? Your web helper can reset access in Supabase.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="../js/env.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="admin-auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const toggleBtn = document.getElementById("togglePassword");
      const errorEl = document.getElementById("loginError");
      const setupEl = document.getElementById("setupHint");
      const submitBtn = document.getElementById("signInBtn");
      const btnLabel = submitBtn.querySelector(".btn-label");
      const params = new URLSearchParams(window.location.search);

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("is-visible");
      }

      function clearError() {
        errorEl.textContent = "";
        errorEl.classList.remove("is-visible");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          btnLabel.innerHTML = '<span class="spinner" aria-hidden="true"></span> Signing in…';
        } else {
          btnLabel.textContent = "Sign In";
        }
      }

      if (params.get("denied") === "1") {
        showError(SRAdminAuth.denyMessage("not_admin"));
      } else if (params.get("expired") === "1") {
        showError("Your session expired. Please sign in again.");
      }

      if (!SRAdminAuth.isEnvConfigured()) {
        setupEl.classList.add("is-visible");
        setupEl.innerHTML =
          "<strong>Setup needed:</strong> Copy <code>js/env.example.js</code> to <code>js/env.js</code> and add your Supabase project URL and anon key (never the service-role key).";
        submitBtn.disabled = true;
      }

      toggleBtn.addEventListener("click", function () {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        toggleBtn.textContent = showing ? "Show" : "Hide";
        toggleBtn.setAttribute("aria-pressed", showing ? "false" : "true");
      });

      SRAdminAuth.redirectIfAdminSession();

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        clearError();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError("Please enter both your email and password.");
          return;
        }

        setLoading(true);
        try {
          await SRAdminAuth.signIn(email, password);
          window.location.replace(SRAdminAuth.DASHBOARD_PATH);
        } catch (err) {
          showError(err && err.message ? err.message : SRAdminAuth.friendlyAuthError(err));
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
