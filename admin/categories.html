<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Categories — S&amp;R Concrete Crafts Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="admin-gate" id="adminGate">Checking your access…</div>

  <div class="admin-app" id="adminApp" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="admin-sidebar" aria-label="Admin menu">
      <div class="sidebar-brand">
        <img src="/assets/sandrlogo.jpg" alt="" width="44" height="44" />
        <div>
          <strong>S&amp;R Concrete Crafts</strong>
          <span>Shop manager</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="adminNav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="account-chip">
          <span class="label">Signed in as</span>
          <span class="email" id="ownerEmail">—</span>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="signOutBtn">Sign Out</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div>
          <h1>Categories</h1>
          <p>Organize products into groups. Products can belong to more than one.</p>
        </div>
      </header>

      <div class="flash" id="flash" hidden role="status"></div>

      <section class="panel">
        <h2 id="catFormTitle">Add category</h2>
        <form id="categoryForm" class="cat-form" novalidate>
          <input type="hidden" id="catId" value="" />
          <div class="form-grid-2">
            <div class="field">
              <label for="catName">Name</label>
              <input id="catName" required maxlength="80" />
            </div>
            <div class="field">
              <label for="catSort">Sort order</label>
              <input id="catSort" type="number" step="1" value="0" />
            </div>
          </div>
          <div class="field">
            <label for="catDesc">Description <span class="optional">optional</span></label>
            <textarea id="catDesc" rows="2" maxlength="500"></textarea>
          </div>
          <div class="field field-checkbox">
            <label><input type="checkbox" id="catActive" checked /> Active (shown in filters)</label>
          </div>
          <div class="editor-actions">
            <button type="submit" class="btn btn-primary" id="catSaveBtn">Save category</button>
            <button type="button" class="btn btn-ghost" id="catCancelBtn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <div id="catState" class="state-box">Loading categories…</div>
      <div id="catList" class="product-table-wrap" hidden></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.0/dist/umd/supabase.min.js"></script>
  <script src="/js/env.js" onerror="window.__SR_ENV_LOAD_ERROR__=true"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/admin/admin-auth.js"></script>
  <script src="/admin/admin-shell.js"></script>
  <script src="/admin/catalog-api.js"></script>
  <script src="/admin/categories.js"></script>
</body>
</html>
