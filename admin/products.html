<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Products — S&amp;R Concrete Crafts Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="admin-gate" id="adminGate">Checking your access…</div>

  <div class="admin-app" id="adminApp" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="admin-sidebar" aria-label="Admin menu">
      <div class="sidebar-brand">
        <img src="/assets/sandrlogo.jpg" alt="" width="44" height="44" />
        <div>
          <strong>S&amp;R Concrete Crafts</strong>
          <span>Shop manager</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="adminNav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="account-chip">
          <span class="label">Signed in as</span>
          <span class="email" id="ownerEmail">—</span>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="signOutBtn">Sign Out</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-controls="adminSidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-row">
          <div>
            <h1>Products</h1>
            <p>Add, edit, and organize your concrete pieces.</p>
          </div>
          <a class="btn btn-primary" href="/admin/product-edit.html">Add Product</a>
        </div>
      </header>

      <div class="notice-banner" id="publishBanner" role="note">
        <strong>Heads up:</strong>
        <span id="publishBannerText">Loading publish notes…</span>
      </div>

      <div class="flash" id="flash" hidden role="status"></div>

      <section class="toolbar panel-tight">
        <label class="sr-only" for="searchInput">Search products</label>
        <input id="searchInput" type="search" placeholder="Search by title…" />
        <label class="sr-only" for="statusFilter">Filter by status</label>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="sold_out">Sold out</option>
          <option value="hidden">Hidden</option>
        </select>
        <label class="sr-only" for="categoryFilter">Filter by category</label>
        <select id="categoryFilter">
          <option value="">All categories</option>
        </select>
      </section>

      <div id="listState" class="state-box">Loading products…</div>
      <div id="productList" class="product-table-wrap" hidden></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/js/env.js" onerror="window.__SR_ENV_LOAD_ERROR__=true"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/admin/admin-auth.js"></script>
  <script src="/admin/admin-shell.js"></script>
  <script src="/admin/catalog-api.js"></script>
  <script src="/admin/products.js"></script>
</body>
</html>
